<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <title>Global Flux Map</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #050505; 
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        h1 { margin-bottom: 5px; color: #fff; letter-spacing: 1px; }

        #controls {
            background: #222;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #444;
            margin-bottom: 20px;
        }

        select {
            background: #333;
            color: white;
            padding: 5px;
            border: 1px solid #555;
            border-radius: 4px;
        }

        #map-container {
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            border-radius: 4px;
            background-color: #000; 
            overflow: hidden;
        }

        .country {
            fill: #151515;      
            stroke: #333;       
            stroke-width: 0.5px;
        }

        /* LIGNES JAUNES */
        .flow-line {
            fill: none;
            stroke: #ffd700;
            stroke-linecap: round;
            opacity: 0.6;
            transition: stroke-width 0.3s, opacity 0.3s;
        }
        
        .flow-line:hover {
            stroke: #fff !important; /* Blanc au survol */
            stroke-opacity: 1 !important;
            cursor: pointer;
            z-index: 1000;
        }

        /* POINTS (Cercles) */
        .dot-source {
            fill: #00ff00; 
            stroke: none;
            pointer-events: none; 
        }
        .dot-target {
            fill: #ff0000; 
            stroke: none;
            pointer-events: none;
        }

        /* TOOLTIP */
        .tooltip {
            position: absolute;
            background: rgba(20, 20, 20, 0.95);
            color: #fff;
            border: 1px solid #ffd700; 
            padding: 8px 12px;
            border-radius: 4px;
            pointer-events: none;
            opacity: 0;
            font-size: 13px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.8);
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <h1>Data Flow Map</h1>
    <div id="controls">
        <label for="manufacturerSelect">Constructeur : </label>
        <select id="manufacturerSelect">
            <option value="all">-- Tous --</option>
        </select>
    </div>

    <div id="map-container"></div>
    <div id="tooltip" class="tooltip"></div>

    <script src="worldMap.js"></script>
</body>
</html>
