<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">


  <meta charset="UTF-8">
  <title>Visualisation Green IT</title>

  <!-- Import D3 (UNE SEULE FOIS) -->
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    h1, h2 {
      margin-top: 40px;
    }
  </style>
</head>

<body>

  <h1>Projet Data Visualisation – Green IT</h1>

  <!-- =========================
       SCATTER PLOT
  ========================== -->
  <h2>Scatter plot</h2>
  <svg id="scatter" width="800" height="500"></svg>
  <script src="src/charts/scatter.js"></script>

  <!-- =========================
       STACKED BAR CHART
  ========================== -->
  <h2>Stacked Bar Chart</h2>
  <svg id="stacked" width="1000" height="500"></svg>
  <script src="src/charts/stacked.js"></script>

  <!-- =========================
       BUBBLE PACK (ZOOMABLE)
  ========================== -->
  <h2>Bubble chart – catégories / appareils</h2>

<div class="pack-layout">
  <div class="pack-left">
    <div id="pack"></div>
  </div>

  <aside class="pack-right">
    

    
  </aside>
</div>

  <script src="src/charts/packed.js"></script>

  <!-- =========================
       CARBON ROAD (PROTO)
  ========================== -->
  <h2>Route carbone (prototype)</h2>

  <label for="deviceSelector"><strong>Type d’appareil :</strong></label>
  <select id="deviceSelector">
    <option value="laptop">Laptop</option>
    <option value="smartphone">Smartphone</option>
  </select>

  <br><br>

  <input 
    type="range" 
    id="timeSlider" 
    min="0" 
    max="10" 
    step="0.1" 
    value="0"
    style="width: 800px;"
  >

  <br><br>

  <svg id="carbon-road" width="1100" height="400"></svg>
  <script src="src/charts/carbonRoad.js"></script>

</body>
</html>
